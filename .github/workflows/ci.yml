name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev,otel]"

      - name: Lint with Ruff
        run: |
          ruff check src tests examples validation

      - name: Run Tests & Coverage
        run: |
          pytest -v --cov=airun --cov-report=xml --cov-report=term-missing

      - name: Build Distribution
        run: |
          python -m build
          twine check dist/*

      - name: Release Dry-Run (Clean Install & Verification)
        run: |
          pip install dist/*.whl
          airun --help
          airun doctor
          airun demo
          airun report latest

  test-rust:
    name: Test Rust (Collector DaemonSet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/airun-collector

      - name: Clippy Check
        run: cargo clippy --manifest-path crates/airun-collector/Cargo.toml -- -D warnings

      - name: Run Rust Tests
        run: cargo test --manifest-path crates/airun-collector/Cargo.toml --verbose

  test-typescript:
    name: Test TypeScript (Control Plane)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: packages/control-plane/package-lock.json

      - name: Install Dependencies
        working-directory: packages/control-plane
        run: npm ci || npm install

      - name: Build & Run Tests
        working-directory: packages/control-plane
        run: |
          npm run build
          npm test
