name: Release & Publish Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      publish_python:
        description: "Publish Python package to PyPI"
        type: boolean
        default: true
      publish_rust:
        description: "Publish Rust crate to crates.io"
        type: boolean
        default: true
      publish_docker:
        description: "Publish Docker image to GHCR"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish-python:
    name: Build & Publish Python (PyPI)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_python
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build & Validation Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Wheel and Source Distribution
        run: |
          python -m build

      - name: Verify Package Metadata
        run: |
          python -m twine check dist/*

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Warn if PyPI Token Missing
        if: env.PYPI_API_TOKEN == ''
        run: |
          echo "::warning::PYPI_API_TOKEN secret is not configured in GitHub repository settings. Skipping PyPI upload."
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-rust:
    name: Build & Publish Rust Crate (crates.io)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_rust
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Version & Publish to crates.io
        working-directory: crates/airun-collector
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not configured in GitHub repository settings. Skipping crates.io publish."
            exit 0
          fi

          # Extract version from Cargo.toml
          CRATE_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "Evaluating airun-collector version: $CRATE_VERSION"

          # Query crates.io registry for existing version
          PUBLISHED_VERSION=$(curl -s "https://crates.io/api/v1/crates/airun-collector/${CRATE_VERSION}" | jq -r '.version.num // empty' || true)

          if [ "$PUBLISHED_VERSION" = "$CRATE_VERSION" ]; then
            echo "Version v${CRATE_VERSION} is already published on crates.io. Skipping upload."
          else
            echo "Publishing new version v${CRATE_VERSION} to crates.io..."
            cargo publish
            echo "Successfully published airun-collector v${CRATE_VERSION} to crates.io!"
          fi

  publish-docker:
    name: Build & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_docker)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

