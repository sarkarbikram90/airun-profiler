[package]
name = "airun-collector"
version = "0.1.5"
edition = "2021"
authors = ["airun Contributors <infra@airun.dev>"]
description = "High-throughput Rust node telemetry collector DaemonSet for NVIDIA DCGM & Kubernetes"
license = "Apache-2.0"
repository = "https://github.com/sarkarbikram90/airun-profiler"
homepage = "https://github.com/sarkarbikram90/airun-profiler"
documentation = "https://docs.rs/airun-collector"
readme = "README.md"
keywords = ["kubernetes", "nvidia", "dcgm", "finops", "telemetry"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
nvml-wrapper = "0.10.0"

