[package]
name = "airun-collector"
version = "0.2.0"
edition = "2021"
authors = ["airun Contributors <infra@airun.dev>"]
description = "High-throughput Rust node telemetry collector DaemonSet for NVIDIA DCGM & Kubernetes"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
