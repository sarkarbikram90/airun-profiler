[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airun-profiler"
version = "0.1.4"
description = "AI Infrastructure Economics & Reliability Platform: Detect GPU Silicon Waste (Dataloader, NCCL, PCIe), Measure Intelligence per Dollar & Watt, and Automate Multi-Model Failover."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Bikram Sarkar" }
]
keywords = [
    "ai-infrastructure",
    "gpu-optimization",
    "finops",
    "nvidia-dcgm",
    "h100",
    "mfu",
    "cuda",
    "opentelemetry",
    "pytorch-profiler",
    "silicon-waste",
    "model-routing",
    "circuit-breaker",
    "disaster-recovery",
    "energy-profiling",
    "llmops",
    "tracing",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/sarkarbikram90/airun-profiler"
Documentation = "https://github.com/sarkarbikram90/airun-profiler#readme"
Repository = "https://github.com/sarkarbikram90/airun-profiler"
"Issue Tracker" = "https://github.com/sarkarbikram90/airun-profiler/issues"
Changelog = "https://github.com/sarkarbikram90/airun-profiler/blob/main/CHANGELOG.md"
Specification = "https://github.com/sarkarbikram90/airun-profiler/blob/main/SPECIFICATION.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.scripts]
airun = "airun.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
