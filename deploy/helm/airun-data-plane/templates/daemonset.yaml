apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-data-plane
  labels:
    app.kubernetes.io/name: airun-data-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: airun-data-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airun-data-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostPID: true
      hostIPC: true
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
        nodeAffinity:
{{ toYaml .Values.nodeAffinity | indent 10 }}
      containers:
        - name: data-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_ID
              value: "{{ .Values.cluster.id }}"
            - name: GCP_PROJECT_ID
              value: "{{ .Values.gcp.projectId }}"
            - name: PUBSUB_TOPIC
              value: "{{ .Values.gcp.pubsubTopic }}"
            - name: RING_BUFFER_CAPACITY
              value: "{{ .Values.dcgm.ringBufferCapacity }}"
          ports:
            - name: otlp-http
              containerPort: {{ .Values.otlp.port }}
              protocol: TCP
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: dcgm-socket
              mountPath: /var/run/nvidia-dcgm
              readOnly: true
            - name: sysfs
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
      volumes:
        - name: dcgm-socket
          hostPath:
            path: {{ .Values.dcgm.socketPath }}
            type: DirectoryOrCreate
        - name: sysfs
          hostPath:
            path: /sys
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
